<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up | Kids Theater & Drama Workshop</title>
    
    <!-- External Libraries -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <!-- Custom Configuration and Styles -->
    <script src="assets/js/tailwind-config.js"></script>
    <link rel="stylesheet" href="assets/css/styles.css">
    <link rel="icon" type="image/svg+xml" href="assets/images/favicon.svg">
</head>
<body class="bg-gray-50 text-gray-900 dark:bg-dark dark:text-gray-100 transition-colors duration-300 min-h-screen flex flex-col relative overflow-x-hidden">

    <!-- Decorative Background Elements -->
    <div class="absolute inset-0 z-0 pointer-events-none">
        <div class="absolute top-0 right-0 w-1/2 h-1/2 bg-secondary/10 rounded-bl-[100%] blur-3xl"></div>
        <div class="absolute bottom-0 left-0 w-1/2 h-1/2 bg-secondary/10 rounded-tr-[100%] blur-3xl"></div>
        <div class="absolute inset-0 bg-[url('https://images.unsplash.com/photo-1510520434104-56167c9c0f91?q=80&w=2070&auto=format&fit=crop')] opacity-5 mix-blend-overlay"></div>
    </div>

    <!-- Toggles (Theme/RTL) -->
    <div class="absolute top-6 right-6 z-50 flex gap-4">
        <button id="theme-toggle" class="p-2 bg-white dark:bg-dark-card rounded-full shadow-md hover:bg-gray-100 dark:hover:bg-gray-800 transition-colors">
            <i data-lucide="moon" id="theme-toggle-dark-icon" class="w-5 h-5 text-gray-600 dark:text-gray-300 hidden"></i>
            <i data-lucide="sun" id="theme-toggle-light-icon" class="w-5 h-5 text-gray-600 dark:text-gray-300"></i>
        </button>
        <button id="rtl-toggle" class="w-10 h-10 flex items-center justify-center bg-white dark:bg-dark-card rounded-full shadow-md text-sm font-bold text-gray-600 dark:text-gray-300 hover:text-primary transition-colors" title="Toggle RTL"><i data-lucide="arrow-left-right" class="w-5 h-5"></i></button>
    </div>

    <div class="flex-grow flex items-center justify-center p-4 relative z-10 my-8 pt-20 md:pt-4">
        <div class="w-full max-w-lg flex rounded-3xl overflow-hidden shadow-2xl bg-white dark:bg-dark-card border border-gray-100 dark:border-gray-800">
            
            <!-- Signup Form -->
            <div class="w-full p-6 md:p-10 flex flex-col justify-center">
                <!-- Logo -->
                <a href="index.html" class="flex items-center gap-3 mb-6 w-fit mx-auto">
                    <div class="w-10 h-10 rounded-full bg-primary flex items-center justify-center text-white shadow-md shrink-0">
                        <i data-lucide="sparkles" class="w-6 h-6"></i>
                    </div>
                    <span class="font-display font-bold text-2xl tracking-tight text-gray-900 dark:text-white">StageSpark</span>
                </a>

                <h1 class="font-display text-xl font-bold mb-1 text-gray-900 dark:text-white text-center">Create Parent Account</h1>
                <p class="text-gray-500 dark:text-gray-400 mb-6 text-sm text-center">Register to manage your children's theater journey.</p>



                <form onsubmit="event.preventDefault(); window.location.href='dashboard.html';" class="space-y-4">
                    <div class="grid grid-cols-1 gap-4">
                        <div>
                            <label for="firstName" class="block text-xs font-medium text-gray-700 dark:text-gray-300 mb-1">First Name</label>
                            <input type="text" id="firstName" class="w-full rounded-xl border border-gray-200 dark:border-gray-700 bg-gray-50 dark:bg-slate-800 px-4 py-3 text-gray-800 dark:text-gray-100 focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent transition-all py-2 text-sm rounded-lg" placeholder="Jane" required>
                        </div>
                        <div>
                            <label for="lastName" class="block text-xs font-medium text-gray-700 dark:text-gray-300 mb-1">Last Name</label>
                            <input type="text" id="lastName" class="w-full rounded-xl border border-gray-200 dark:border-gray-700 bg-gray-50 dark:bg-slate-800 px-4 py-3 text-gray-800 dark:text-gray-100 focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent transition-all py-2 text-sm rounded-lg" placeholder="Doe" required>
                        </div>
                    </div>

                    <div class="grid grid-cols-1 gap-4">
                        <div>
                            <label for="email" class="block text-xs font-medium text-gray-700 dark:text-gray-300 mb-1">Email Address</label>
                            <input type="email" id="email" class="w-full rounded-xl border border-gray-200 dark:border-gray-700 bg-gray-50 dark:bg-slate-800 px-4 py-3 text-gray-800 dark:text-gray-100 focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent transition-all py-2 text-sm rounded-lg" placeholder="name@example.com" required>
                        </div>
                        <div>
                            <label for="phone" class="block text-xs font-medium text-gray-700 dark:text-gray-300 mb-1">Phone Number</label>
                            <input type="tel" id="phone" class="w-full rounded-xl border border-gray-200 dark:border-gray-700 bg-gray-50 dark:bg-slate-800 px-4 py-3 text-gray-800 dark:text-gray-100 focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent transition-all py-2 text-sm rounded-lg" placeholder="(555) 000-0000" required>
                        </div>
                    </div>

                    <div class="grid grid-cols-1 gap-4">
                        <div>
                            <label for="password" class="block text-xs font-medium text-gray-700 dark:text-gray-300 mb-1">Password</label>
                            <div class="relative">
                                <input type="password" id="password" class="w-full rounded-xl border border-gray-200 dark:border-gray-700 bg-gray-50 dark:bg-slate-800 px-4 py-3 text-gray-800 dark:text-gray-100 focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent transition-all py-2 pr-10 text-sm rounded-lg" placeholder="••••••••" required>
                                <button type="button" id="togglePassword1" class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-400 hover:text-gray-600">
                                    <i data-lucide="eye" id="eye-icon-1" class="w-4 h-4"></i>
                                    <i data-lucide="eye-off" id="eye-off-icon-1" class="w-4 h-4 hidden"></i>
                                </button>
                            </div>
                        </div>
                        <div>
                            <label for="confirmPassword" class="block text-xs font-medium text-gray-700 dark:text-gray-300 mb-1">Confirm Password</label>
                            <div class="relative">
                                <input type="password" id="confirmPassword" class="w-full rounded-xl border border-gray-200 dark:border-gray-700 bg-gray-50 dark:bg-slate-800 px-4 py-3 text-gray-800 dark:text-gray-100 focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent transition-all py-2 pr-10 text-sm rounded-lg" placeholder="••••••••" required>
                                <button type="button" id="togglePassword2" class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-400 hover:text-gray-600">
                                    <i data-lucide="eye" id="eye-icon-2" class="w-4 h-4"></i>
                                    <i data-lucide="eye-off" id="eye-off-icon-2" class="w-4 h-4 hidden"></i>
                                </button>
                            </div>
                        </div>
                    </div>

                    <div class="flex items-start mt-2">
                        <div class="flex items-center h-5">
                            <input id="terms" name="terms" type="checkbox" required class="w-4 h-4 rounded border-gray-300 text-primary focus:ring-primary dark:border-gray-600 dark:bg-dark-card accent-primary mt-0.5">
                        </div>
                        <div class="ms-2 text-xs">
                            <label for="terms" class="text-gray-600 dark:text-gray-400">I agree to the <a href="#" class="text-primary hover:underline font-medium">Terms & Conditions</a> and <a href="#" class="text-primary hover:underline font-medium">Privacy Policy</a>.</label>
                        </div>
                    </div>

                    <button type="submit" class="w-full bg-primary hover:bg-primary-dark text-white font-bold py-3 rounded-xl transition-all shadow-theater hover:shadow-lg mt-4 text-sm">
                        Create Account
                    </button>
                </form>

                <div class="relative flex items-center my-6">
                    <div class="flex-grow border-t border-gray-200 dark:border-gray-700"></div>
                    <span class="flex-shrink-0 mx-4 text-gray-400 text-xs uppercase font-bold">or continue with</span>
                    <div class="flex-grow border-t border-gray-200 dark:border-gray-700"></div>
                </div>

                <!-- Social Login -->
                <div class="flex gap-4 justify-center">
                    <button class="flex-1 flex justify-center items-center py-2 border border-gray-200 dark:border-gray-700 rounded-lg hover:bg-gray-50 dark:hover:bg-gray-800 hover:-translate-y-1 hover:shadow-md hover:border-primary/50 transition-all duration-300">
                        <img src="https://www.svgrepo.com/show/475656/google-color.svg" alt="Google" class="w-5 h-5">
                    </button>
                    <button class="flex-1 flex justify-center items-center py-2 border border-gray-200 dark:border-gray-700 rounded-lg hover:bg-gray-50 dark:hover:bg-gray-800 hover:-translate-y-1 hover:shadow-md hover:border-primary/50 transition-all duration-300">
                        <img src="https://www.svgrepo.com/show/475647/facebook-color.svg" alt="Facebook" class="w-5 h-5">
                    </button>
                    <button class="flex-1 flex justify-center items-center py-2 border border-gray-200 dark:border-gray-700 rounded-lg hover:bg-gray-50 dark:hover:bg-gray-800 hover:-translate-y-1 hover:shadow-md hover:border-primary/50 transition-all duration-300">
                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="currentColor" class="w-6 h-6 text-black dark:text-white"><path d="M16.142 2.656A4.542 4.542 0 0 0 15 5.5c0 .104.01.21.021.312a4.417 4.417 0 0 0 1.25-2.885c0-.125-.01-.25-.021-.375z"/><path d="M12.152 6.13c-.927 0-1.74.573-2.614.573-1.073 0-2.208-.573-3.417-.573C4.22 6.13 2 8.35 2 11.23c0 3.323 2.167 6.135 4.396 9.385C7.52 22.312 8.448 24 9.615 24c1.177 0 1.635-.729 3.104-.729 1.48 0 1.885.74 3.125.74 1.21 0 2.042-1.604 3.125-3.23.99-1.447 1.417-2.864 1.417-2.927-.031-.01-2.73-1.062-2.73-4.187 0-2.625 2.135-3.875 2.23-3.927-1.25-1.844-3.188-2.094-3.896-2.156-1.573-.136-3.167.906-3.834.906z"/></svg>
                    </button>
                </div>

                <p class="mt-6 text-center text-xs text-gray-600 dark:text-gray-400">
                    Already have an account? <a href="login.html" class="font-bold text-primary hover:text-primary-dark hover:underline text-sm">Sign in</a>
                </p>
            </div>
        </div>
    </div>

    <!-- Initialize Icons & Logic -->
    <script>
        lucide.createIcons();

        // Password visibility toggle logic
        const setupToggle = (btnId, inputId, eyeId, eyeOffId) => {
            const btn = document.getElementById(btnId);
            const input = document.getElementById(inputId);
            const eye = document.getElementById(eyeId);
            const eyeOff = document.getElementById(eyeOffId);

            btn.addEventListener('click', () => {
                if (input.type === 'password') {
                    input.type = 'text';
                    eye.classList.add('hidden');
                    eyeOff.classList.remove('hidden');
                } else {
                    input.type = 'password';
                    eye.classList.remove('hidden');
                    eyeOff.classList.add('hidden');
                }
            });
        };

        setupToggle('togglePassword1', 'password', 'eye-icon-1', 'eye-off-icon-1');
        setupToggle('togglePassword2', 'confirmPassword', 'eye-icon-2', 'eye-off-icon-2');
    </script>
    <script src="assets/js/main.js"></script>
</body>
</html>
